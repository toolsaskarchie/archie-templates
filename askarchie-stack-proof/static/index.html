<!doctype html>
<!-- AskArchie quotes, static form (S3 + CloudFront). Upload index.html + quotes.json to the bucket.
     The page reads quotes.json through CloudFront and inspects the response headers to prove each hop. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AskArchie Stack Proof</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#0b0d18;--surface:#12152a;--border:#1e2340;--accent:#5c5af6;--glow:rgba(92,90,246,.25);
--text:#e8eaf0;--muted:#8b8fa8;--ok:#34d399;--bad:#f87171}
html,body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
font-family:Inter,ui-sans-serif,system-ui,sans-serif;display:flex;justify-content:center;align-items:flex-start}
body::before{content:'';position:fixed;top:10%;left:50%;transform:translateX(-50%);width:600px;max-width:100vw;height:400px;
background:radial-gradient(ellipse at center,var(--glow) 0%,transparent 70%);pointer-events:none}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:1rem;
padding:2.5rem 2rem 2rem;max-width:44rem;width:calc(100% - 2rem);margin:2rem 0;
box-shadow:0 0 0 1px rgba(92,90,246,.08),0 24px 48px rgba(0,0,0,.4)}
.card::before{content:'';position:absolute;top:0;left:2rem;right:2rem;height:2px;
background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.brand{display:flex;align-items:center;justify-content:center;gap:.55rem;margin-bottom:.4rem;font-weight:600}
.brand img{width:28px;height:28px;border-radius:6px}
.stack{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:2rem}
blockquote{margin:0 0 1.5rem;font-size:1.45rem;font-weight:300;line-height:1.45;text-align:center}
.label{color:var(--muted);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.35rem}
.badge{display:block;text-align:center;font-weight:600;letter-spacing:.04em;padding:.6rem;border-radius:.6rem;margin:1rem 0 .8rem}
.badge.ok{background:rgba(52,211,153,.12);color:var(--ok)} .badge.bad{background:rgba(248,113,113,.12);color:var(--bad)}
ul.hops{list-style:none;margin:0;padding:0}
ul.hops li{display:flex;gap:.7rem;padding:.55rem 0;border-top:1px solid var(--border)}
.dot{font-weight:700;width:1.1rem} li.ok .dot{color:var(--ok)} li.bad .dot{color:var(--bad)}
.hop{font-weight:500;font-size:.92rem} .detail{color:var(--muted);font-size:.8rem;word-break:break-word}
footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:1.6rem} a{color:var(--accent)}
</style></head><body><main class="card">
<div class="brand"><img src="https://askarchie.io/logos/archie-tile-on-dark.png" alt="">AskArchie</div>
<div class="stack">S3 · CloudFront</div>
<blockquote id="quote">…</blockquote>
<div class="label">Stack proof</div>
<span id="badge" class="badge">checking…</span>
<ul class="hops" id="hops"></ul>
<footer>The Agentic Development Platform · <a href="">refresh</a></footer>
</main>
<script>
const hops = [];
const add = (hop, ok, detail) => hops.push({hop, ok, detail});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

(async () => {
  add("Served over HTTPS", location.protocol === "https:",
      location.protocol === "https:" ? `${location.host} (TLS terminated at the edge)` : "page is not on https");
  try {
    const r = await fetch("quotes.json", {cache: "no-store"});
    const h = n => r.headers.get(n) || "";
    const pop = h("x-amz-cf-pop"), via = h("via"), xc = h("x-cache");
    add("Browser → CloudFront edge", !!pop || /cloudfront/i.test(via),
        pop ? `edge ${pop} · ${xc || "no x-cache"}` : "no CloudFront headers: this was not served by CloudFront");
    const quotes = r.ok ? await r.json() : null;
    const fromS3 = /AmazonS3/i.test(h("server")) || !!h("x-amz-server-side-encryption") || !!h("x-amz-version-id");
    add("CloudFront → S3 origin", r.ok && fromS3 && Array.isArray(quotes),
        r.ok ? `${quotes.length} quotes · server ${h("server") || "?"} · etag ${h("etag") || "?"}` +
               (h("x-amz-server-side-encryption") ? ` · SSE ${h("x-amz-server-side-encryption")}` : "")
             : `quotes.json returned HTTP ${r.status}`);
    if (quotes && quotes.length) {
      document.getElementById("quote").textContent = "“" + quotes[Math.floor(Math.random()*quotes.length)].text + "”";
    }
  } catch (e) {
    add("Browser → CloudFront → S3", false, e.message);
  }
  if (!hops.slice(1).some(x => x.ok)) document.getElementById("quote").textContent = "No quote. The origin did not answer, so this stack is not wired.";
  const ok = hops.every(x => x.ok), broken = hops.find(x => !x.ok);
  const badge = document.getElementById("badge");
  badge.className = "badge " + (ok ? "ok" : "bad");
  badge.textContent = ok ? "WIRED: every hop answered" : "BROKEN at: " + broken.hop;
  document.getElementById("hops").innerHTML = hops.map(x =>
    `<li class="${x.ok ? "ok" : "bad"}"><span class="dot">${x.ok ? "✓" : "✗"}</span><div><div class="hop">${esc(x.hop)}</div><div class="detail">${esc(x.detail)}</div></div></li>`).join("");
})();
</script>
</body></html>
